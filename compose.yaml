services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servermap}
      POSTGRES_USER: ${POSTGRES_USER:-servermap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servermap} -d ${POSTGRES_DB:-servermap}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
