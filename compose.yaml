services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servermap}
      POSTGRES_USER: ${POSTGRES_USER:-servermap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servermap} -d ${POSTGRES_DB:-servermap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-servermap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-servermap}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Configure ADMIN_API_TOKEN in .env}
      HOST: 0.0.0.0
      PORT: 3333
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - application

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_ORIGIN: http://api:3333
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    networks:
      - application

networks:
  database:
    internal: true
  application:
    internal: true

volumes:
  pgdata:
