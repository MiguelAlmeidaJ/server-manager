name: Validate ServerMap

on:
  push:
    branches: [beta]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/servermap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build API and frontend
        run: pnpm build
